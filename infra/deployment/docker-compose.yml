# Local/staging stack: PostgreSQL + license API.
# Usage: LICENSE_SIGNING_PRIVATE_KEY="$(...)" docker compose -f infra/deployment/docker-compose.yml up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis-local-only}
      POSTGRES_DB: jarvis
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jarvis']
      interval: 5s
  license-api:
    build: { context: ../.., dockerfile: infra/deployment/Dockerfile.license-api }
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://jarvis:${POSTGRES_PASSWORD:-jarvis-local-only}@db:5432/jarvis
      LICENSE_SIGNING_PRIVATE_KEY: ${LICENSE_SIGNING_PRIVATE_KEY:?set LICENSE_SIGNING_PRIVATE_KEY}
      ADMIN_ORIGINS: ${ADMIN_ORIGINS:-http://localhost:5174}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      GATEWAY_WEBHOOK_SECRET: ${GATEWAY_WEBHOOK_SECRET:-}
    ports: ['8787:8787']
volumes:
  pgdata:
