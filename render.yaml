# Render Blueprint: license API (Docker) + PostgreSQL + admin portal (static).
# Render dashboard → New → Blueprint → select this repository.
# You will be asked for the values marked `sync: false` (see docs/setup/GO_LIVE_URDU.md).
# VERIFY plan names/prices in the Render dashboard before creating (free databases expire).
databases:
  - name: jarvis-db
    databaseName: jarvis
    user: jarvis

services:
  - type: web
    name: jarvis-license-api
    runtime: docker
    dockerfilePath: ./infra/deployment/Dockerfile.license-api
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-db
          property: connectionString
      - key: LICENSE_SIGNING_PRIVATE_KEY
        sync: false
      - key: ADMIN_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TRUST_PROXY
        value: 'true'
      - key: LICENSE_API_PORT
        value: '10000'

  - type: web
    name: jarvis-admin
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @jarvis/admin build
    staticPublishPath: ./apps/admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_LICENSE_API_URL
        sync: false
